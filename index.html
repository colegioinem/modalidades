<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="icon" href="./images/favicon_unicorn.png" />

    <title>INEM Villavicencio</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Arial", sans-serif;
        background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
      }

      .container {
        background: white;
        border-radius: 20px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        max-width: 600px;
        width: 100%;
        padding: 50px 40px;
        text-align: center;
      }

      .logo-container {
        margin-bottom: 30px;
        animation: fadeInDown 1s ease-out;
      }

      .logo-container img {
        max-width: 300px;
        width: 100%;
        height: auto;
        filter: drop-shadow(0 5px 15px rgba(0, 0, 0, 0.2));
      }

      h1 {
        color: #1e3c72;
        font-size: 2.5em;
        margin-bottom: 20px;
        animation: fadeIn 1.2s ease-out;
      }

      .subtitle {
        color: #555;
        font-size: 1.1em;
        margin-bottom: 40px;
        animation: fadeIn 1.4s ease-out;
      }

      .btn-modalidades {
        display: inline-block;
        background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
        color: white;
        text-decoration: none;
        padding: 18px 50px;
        border-radius: 50px;
        font-size: 1.2em;
        font-weight: bold;
        transition: all 0.3s ease;
        box-shadow: 0 5px 20px rgba(30, 60, 114, 0.4);
        animation: fadeInUp 1.6s ease-out;
        border: 3px solid transparent;
      }

      .btn-modalidades:hover {
        transform: translateY(-3px);
        box-shadow: 0 10px 30px rgba(30, 60, 114, 0.6);
        border-color: #ffd700;
        background: linear-gradient(135deg, #2a5298 0%, #1e3c72 100%);
      }

      .btn-modalidades:active {
        transform: translateY(-1px);
      }

      .decorative-line {
        width: 100px;
        height: 4px;
        background: linear-gradient(90deg, #1e3c72, #ffd700, #1e3c72);
        margin: 30px auto;
        border-radius: 2px;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      @keyframes fadeInDown {
        from {
          opacity: 0;
          transform: translateY(-30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @media (max-width: 600px) {
        .container {
          padding: 30px 20px;
        }

        h1 {
          font-size: 2em;
        }

        .logo-container img {
          max-width: 200px;
        }

        .btn-modalidades {
          padding: 15px 40px;
          font-size: 1em;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="logo-container">
        <img src="./images/logo.png" alt="INEM Villavicencio Logo" />
      </div>

      <div class="decorative-line"></div>

      <h1>Bienvenidos</h1>
      <p class="subtitle">Colegio INEM Luis Lopez de Mesa</p>

      <a
        href="https://docs.google.com/forms/d/e/1FAIpQLSdAL6Wxq8zEg8SpNlTW382RFLV98pJNMhG_6z7bKfztgNcfFQ/viewform"
        class="btn-modalidades"
        target="_blank"
        >Modalidades</a
      >
    </div>
  </body>
</html>
