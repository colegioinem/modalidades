<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INEM Villavicencio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            padding: 50px 40px;
            text-align: center;
        }

        .logo-container {
            margin-bottom: 30px;
            animation: fadeInDown 1s ease-out;
        }

        .logo-container img {
            max-width: 300px;
            width: 100%;
            height: auto;
            filter: drop-shadow(0 5px 15px rgba(0, 0, 0, 0.2));
        }

        h1 {
            color: #1e3c72;
            font-size: 2.5em;
            margin-bottom: 20px;
            animation: fadeIn 1.2s ease-out;
        }

        .subtitle {
            color: #555;
            font-size: 1.1em;
            margin-bottom: 40px;
            animation: fadeIn 1.4s ease-out;
        }

        .btn-modalidades {
            display: inline-block;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            text-decoration: none;
            padding: 18px 50px;
            border-radius: 50px;
            font-size: 1.2em;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 5px 20px rgba(30, 60, 114, 0.4);
            animation: fadeInUp 1.6s ease-out;
            border: 3px solid transparent;
        }

        .btn-modalidades:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(30, 60, 114, 0.6);
            border-color: #ffd700;
            background: linear-gradient(135deg, #2a5298 0%, #1e3c72 100%);
        }

        .btn-modalidades:active {
            transform: translateY(-1px);
        }

        .decorative-line {
            width: 100px;
            height: 4px;
            background: linear-gradient(90deg, #1e3c72, #ffd700, #1e3c72);
            margin: 30px auto;
            border-radius: 2px;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 600px) {
            .container {
                padding: 30px 20px;
            }

            h1 {
                font-size: 2em;
            }

            .logo-container img {
                max-width: 200px;
            }

            .btn-modalidades {
                padding: 15px 40px;
                font-size: 1em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-container">
            <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 300 200'%3E%3Cdefs%3E%3ClinearGradient id='blueGrad' x1='0%25' y1='0%25' x2='0%25' y2='100%25'%3E%3Cstop offset='0%25' style='stop-color:%231e3c72'/%3E%3Cstop offset='100%25' style='stop-color:%232a5298'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath d='M 30 170 L 150 30 L 270 170 Z' fill='url(%23blueGrad)' stroke='%23ffd700' stroke-width='4'/%3E%3Cpath d='M 70 130 L 70 90 L 130 90 L 130 130 L 70 130 M 75 125 L 125 125 L 125 95 L 75 95 Z' fill='%23ffd700'/%3E%3Cpath d='M 150 90 L 150 130 M 155 90 L 155 130' stroke='%23ffd700' stroke-width='2' fill='none'/%3E%3Cpath d='M 170 130 L 230 130 L 230 90 L 170 90 L 170 130 M 175 125 L 225 125 L 225 95 L 175 95 Z' fill='%23ffd700'/%3E%3Cpath d='M 200 75 Q 210 70 210 85 Q 210 95 200 90 L 200 75' fill='%23ffd700'/%3E%3Ctext x='150' y='155' font-family='Arial, sans-serif' font-size='32' font-weight='bold' fill='%23ffd700' text-anchor='middle'%3EINEM%3C/text%3E%3Ctext x='150' y='175' font-family='Arial, sans-serif' font-size='14' fill='%23ffd700' text-anchor='middle'%3EVILLAVICENCIO%3C/text%3E%3C/svg%3E" alt="INEM Villavicencio Logo">
        </div>

        <div class="decorative-line"></div>

        <h1>Bienvenidos</h1>
        <p class="subtitle">Instituto Nacional de Educación Media</p>

        <a href="https://docs.google.com/forms/d/e/1FAIpQLSd3G1kT-RadBrXAwXY5gEkI7xki48lOMrZvOX3j5BB4M_RECg/viewform?usp=header" class="btn-modalidades" target="_blank">Modalidades</a>
    </div>
</body>
</html>
